# Alembic — configuración
#
# La URL NO se pone aquí: la resuelve env.py desde MIGRATION_URL / DATABASE_URL
# para que las credenciales vivan solo en el entorno y nunca en el repositorio.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Nombres estables y ordenables. Sin timestamps: si Emergent y yo generamos
# revisiones en paralelo, un choque de número es un conflicto de merge visible;
# con timestamps sería un orden silenciosamente distinto en cada máquina.
file_template = %%(rev)s_%%(slug)s

[post_write_hooks]
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
