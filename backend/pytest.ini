[pytest]
testpaths = tests
asyncio_mode = strict
; app/db/session.py crea el engine de SQLAlchemy UNA vez, a nivel de módulo,
; con su propio pool de conexiones asyncpg — igual que en la app real, donde
; vive mientras dura el proceso de uvicorn. El scope de loop por defecto de
; pytest-asyncio es "function": un event loop nuevo por test, que las
; conexiones asyncpg del pool (atadas al loop en que nacieron) no sobreviven.
; Sin esto, el segundo test que toca la base falla con
; "cannot perform operation: another operation is in progress" — no es un bug
; de la app, es el engine global y el loop por-test peleando por la conexión.
asyncio_default_fixture_loop_scope = session
asyncio_default_test_loop_scope = session
