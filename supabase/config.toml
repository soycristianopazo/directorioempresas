project_id = "directorio-empresas"

[api]
enabled = true
port = 54321
# `app` NO se expone: contiene los helpers de RLS y no debe ser invocable
# como RPC desde el cliente. Ver migración 0006.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.pooler]
enabled = false

[studio]
enabled = true
port = 54323

[inbucket]
# Servidor de correo local: aquí llegan las confirmaciones y recuperaciones.
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "100MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true
# Refleja la política del formulario de registro (src/app/(auth)/register).
[auth.email.template.invite]
subject = "Te invitaron a una organización"

[auth.sessions]
# Cierra sesiones inactivas: es una plataforma con datos comerciales sensibles.
inactivity_timeout = "72h"

[analytics]
enabled = false
